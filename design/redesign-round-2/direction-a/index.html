<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekoway Round 2 — Product Theatre</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip-link" href="#products">Skip to products</a>
    <div class="concept-label">Round 2 · Direction A · Product Theatre</div>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Ekoway home">
        <img src="/frontend/public/ekoway/ekoway-logo.jpeg" alt="Ekoway Hardware" />
        <span><strong>Ekoway</strong><small>Hardware · Sibu</small></span>
      </a>
      <label class="search">
        <span>Find tools, materials and home essentials</span>
        <input id="search" type="search" placeholder="Search the Ekoway shelves" />
      </label>
      <div class="utilities" aria-label="Store utilities">
        <button type="button">Account</button>
        <button type="button" class="cart">Cart</button>
      </div>
    </header>

    <nav class="counter-rail" aria-label="Product categories">
      <div class="rail-heading"><span>EKW / 01</span><strong>Counter Rail</strong></div>
      <div class="rail-track" id="category-rail"></div>
    </nav>

    <main id="products">
      <div class="collection-heading">
        <div><span class="eyebrow">Available now · Salim counter</span><h1>Products, staged to compare.</h1></div>
        <p><strong id="result-count">0 products</strong><span>Real prices. Real stock. One clear shelf.</span></p>
      </div>
      <section class="theatre-grid" id="product-grid" aria-live="polite"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
