# Manual PostgreSQL cluster upgrade on the production VPS (catalog-version
# moves like 19beta1 -> 19beta3 that a normal deploy cannot perform).
#
# Runs scripts/upgrade-postgres-cluster.sh ON THE VPS from the currently
# deployed release bundle (dry-run first), then flips the pinned engine tag in
# Git in the same run so the next automated deploy converges instead of
# crash-looping the new cluster. See docs/postgres-cluster-upgrade-runbook.md.
#
# Dispatch-only; shares the online-shopping-production concurrency group with
# deploys, so it can never interleave with a release.

name: Upgrade Postgres cluster

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target postgres image tag'
        required: true
        default: '19beta3'
      from_tag:
        description: 'Current postgres image tag pinned in Git'
        required: true
        default: '19beta1'
      confirm:
        description: 'Type UPGRADE POSTGRES to confirm (brief app downtime)'
        required: true

permissions:
  contents: read

concurrency:
  group: online-shopping-production
  cancel-in-progress: false

env:
  VPS_HOST: 13.251.162.88
  VPS_USER: ubuntu
  VPS_HOST_KEY: "13.251.162.88 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxQLowecYMuChjSX+ePbEKdDq0m8NfT8kfKaSw0Z3sF"

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation phrase
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm }}" == "UPGRADE POSTGRES" ]] \
            || { echo 'Confirmation must be exactly: UPGRADE POSTGRES' >&2; exit 1; }

  preflight:
    name: Dry-run preflight on the VPS
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH access
        shell: bash
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$LIGHTSAIL_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/lightsail-key"
          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lightsail-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/lightsail-known-hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/lightsail-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/lightsail-known-hosts" \
            | grep -Fq 'SHA256:EvysNdkRZEdS5wOyNFI+lZs2dH589gW9ycQGAiVImsE'

      - name: Read-only preflight (DRY_RUN)
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/lightsail-key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/lightsail-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             release=\"/opt/online-shopping/releases/\$(cat /opt/online-shopping/current-tag)\"
             sudo DRY_RUN=1 bash \"\$release/upgrade-postgres-cluster.sh\" '${{ inputs.target_tag }}'"

  upgrade:
    name: Upgrade cluster (brief downtime)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH access
        shell: bash
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$LIGHTSAIL_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/lightsail-key"
          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lightsail-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/lightsail-known-hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/lightsail-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/lightsail-known-hosts" \
            | grep -Fq 'SHA256:EvysNdkRZEdS5wOyNFI+lZs2dH589gW9ycQGAiVImsE'

      - name: Run the upgrade with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/lightsail-key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/lightsail-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             release=\"/opt/online-shopping/releases/\$(cat /opt/online-shopping/current-tag)\"
             sudo bash \"\$release/upgrade-postgres-cluster.sh\" '${{ inputs.target_tag }}' --yes"

  flip-pin:
    name: Flip the pinned tag in Git
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace ${{ inputs.from_tag }} -> ${{ inputs.target_tag }}
        id: flip
        shell: bash
        run: |
          set -euo pipefail
          files="deploy/deploy.sh deploy/docker-compose.prod.yml docker-compose.yml \
            .github/workflows/ci.yml .github/workflows/pg-upgrade.yml \
            scripts/test-restore-atomicity.sh scripts/restore-proof.sh \
            scripts/test-restore-proof-negative.sh README.md CLAUDE.md"
          changed=0
          for f in $files; do
            [[ -f "$f" ]] || continue
            if grep -q "postgres:${{ inputs.from_tag }}" "$f"; then
              sed -i "s/postgres:${{ inputs.from_tag }}/postgres:${{ inputs.target_tag }}/g" "$f"
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit and push the pin flip
        if: steps.flip.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deploy): complete the Postgres ${{ inputs.target_tag }} move

          Automated follow-up to the pg-upgrade workflow: the live cluster now
          runs ${{ inputs.target_tag }} (dump -> fresh initdb -> restore succeeded),
          so the repository pins the same tag. Reverts the temporary hold from
          f0016c6."
          git push origin main

      - name: Report
        if: steps.flip.outputs.changed == '0'
        run: echo "Nothing to flip - Git already pins postgres:${{ inputs.target_tag }}."
