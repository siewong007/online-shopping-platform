name: CI

on:
  pull_request:
  push:
    # joseph runs CI on push so the backup/restore safety suites gate the working branch
    # too; production deployment stays main-only (deploy.yml workflow_run gate).
    branches: [main, joseph]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:19beta1
        env:
          POSTGRES_USER: project_depot
          POSTGRES_PASSWORD: project_depot
          POSTGRES_DB: project_depot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_depot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://project_depot:project_depot@localhost:5432/project_depot
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Apply database migrations
        run: |
          for file in migrations/*.sql; do
            echo "Applying $file"
            PGPASSWORD=project_depot psql -v ON_ERROR_STOP=1 -h localhost -U project_depot -d project_depot -f "$file"
          done

      - name: Run tests
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun: 1.3.14

      # setup-bun only caches the Bun binary itself; package caching is keyed on the lockfile.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  backup-restore:
    name: Backup/restore guardrail tests
    runs-on: ubuntu-latest
    # Single source of truth for the shell scripts that must pass bash -n and ShellCheck.
    # Keep identical to the SCRIPTS list in scripts/run-all-checks.sh (CI cannot source that
    # file: repository scripts are mode 100644 and CI must not depend on executable bits).
    env:
      SHELL_SCRIPTS: >-
        deploy/deploy.sh
        deploy/backup.sh
        deploy/restore.sh
        deploy/backup-capacity.sh
        deploy/backup-env-parser.sh
        deploy/notify-backup-failure.sh
        scripts/preflight-backup.sh
        scripts/check-backup-health.sh
        scripts/check-disk-usage.sh
        scripts/upgrade-postgres-cluster.sh
        scripts/restore-proof.sh
        scripts/run-all-checks.sh
        scripts/test-backup-env-parser.sh
        scripts/test-backup.sh
        scripts/test-restore.sh
        scripts/test-predeploy.sh
        scripts/test-deploy.sh
        scripts/test-backup-health.sh
        scripts/test-preflight-capacity.sh
        scripts/test-release-bundle.sh
        scripts/test-restore-atomicity.sh
        scripts/test-restore-proof-negative.sh
        scripts/test-age-header-helper.sh
        scripts/test-restore-proof-cleanup.sh
        scripts/test-snapshot-publish.sh
        scripts/test-systemd-units.sh
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck, age and rclone
        run: sudo apt-get update && sudo apt-get install -y shellcheck age rclone

      - name: Shell syntax check (bash -n)
        run: |
          set -euo pipefail
          for f in $SHELL_SCRIPTS; do
            [[ -f "$f" ]] || { echo "missing script: $f" >&2; exit 1; }
            sed 's/\r$//' "$f" | bash -n
            echo "  ok: $f"
          done

      - name: ShellCheck (LF-normalized copies)
        run: |
          set -euo pipefail
          for f in $SHELL_SCRIPTS; do
            sed 's/\r$//' "$f" > "/tmp/lf-$(basename "$f")"
            shellcheck -x "/tmp/lf-$(basename "$f")"
            echo "  ok: $f"
          done

      # P0-BKP-01: static unit-validation gate (ubuntu-latest ships systemd-analyze). This is
      # deliberately a separate step, NOT a 15th functional suite: the 14 suites below keep
      # their meaning. Catches unknown/wrong-section directives that systemd-analyze reports
      # as warnings with exit status 0 (the production OnFailure-under-[Service] defect).
      - name: Validate delivered systemd units (systemd-analyze verify)
        run: bash scripts/test-systemd-units.sh

      # N3: CI asserts every runtime dependency of the backup scripts appears in
      # release-components.txt — the manifest cannot silently drop a component.
      - name: Check release manifest covers runtime dependencies
        run: |
          set -euo pipefail
          for dep in deploy/backup.sh deploy/backup-capacity.sh deploy/backup-env-parser.sh \
                     deploy/restore.sh deploy/notify-backup-failure.sh \
                     deploy/online-shopping-backup.service deploy/online-shopping-backup.timer \
                     deploy/online-shopping-backup-health.service deploy/online-shopping-backup-health.timer \
                     deploy/online-shopping-backup-notify.service scripts/preflight-backup.sh \
                     scripts/check-backup-health.sh scripts/check-disk-usage.sh \
                     deploy/online-shopping-disk-usage.service deploy/online-shopping-disk-usage.timer; do
            grep -qxF "$(printf '%s\t%s' "$dep" "$(basename "$dep")")" deploy/release-components.txt \
              || { echo "release-components.txt missing dependency: $dep" >&2; exit 1; }
            echo "  ok: $dep in manifest"
          done

      # Repository scripts are mode 100644: every suite is invoked as `bash <script>` so CI
      # never depends on executable bits.
      - name: Run backup env parser suite
        run: bash scripts/test-backup-env-parser.sh

      - name: Run backup guardrail suite
        run: bash scripts/test-backup.sh

      - name: Run restore guardrail suite
        run: bash scripts/test-restore.sh

      - name: Run predeploy guardrail suite
        run: bash scripts/test-predeploy.sh

      - name: Run deploy guardrail suite
        run: bash scripts/test-deploy.sh

      - name: Run backup health suite
        run: bash scripts/test-backup-health.sh

      - name: Run preflight/backup capacity parity suite
        run: bash scripts/test-preflight-capacity.sh

      - name: Run release bundle smoke test
        run: bash scripts/test-release-bundle.sh

      - name: Run age header helper suite
        run: bash scripts/test-age-header-helper.sh

      - name: Run restore proof cleanup suite
        run: bash scripts/test-restore-proof-cleanup.sh

      - name: Run snapshot publish suite
        run: bash scripts/test-snapshot-publish.sh

      - name: Start seeded source database for disaster-recovery tests
        run: |
          set -euo pipefail
          docker run -d --name online-shopping-db \
            -e POSTGRES_USER=project_depot \
            -e POSTGRES_PASSWORD=project_depot \
            -e POSTGRES_DB=project_depot \
            postgres:19beta1
          ready=0
          for _ in $(seq 1 60); do
            if docker exec online-shopping-db pg_isready -U project_depot -d project_depot >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "$ready" == 1 ]] || { echo "source DB never became ready" >&2; exit 1; }
          docker exec -i online-shopping-db psql -v ON_ERROR_STOP=1 -U project_depot -d project_depot <<'SQL'
          CREATE TABLE IF NOT EXISTS app_schema_migrations (
              version     INTEGER PRIMARY KEY,
              filename    TEXT NOT NULL UNIQUE,
              checksum    TEXT NOT NULL,
              applied_at  TIMESTAMPTZ NOT NULL DEFAULT now()
          );
          SQL
          for f in backend/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            [[ -f "$f" ]] || continue
            filename=$(basename "$f")
            version=${filename%%_*}
            checksum=$(sha256sum "$f" | cut -d' ' -f1)
            { printf 'BEGIN;\n'; cat "$f"; printf "\nINSERT INTO app_schema_migrations (version, filename, checksum) VALUES (%d, '%s', '%s');\nCOMMIT;\n" "$((10#$version))" "$filename" "$checksum"; } \
              | docker exec -i online-shopping-db psql -v ON_ERROR_STOP=1 -U project_depot -d project_depot
          done
          docker exec -i online-shopping-db psql -v ON_ERROR_STOP=1 -U project_depot -d project_depot < scripts/ci-seed-db.sql
          echo "source DB seeded: $(docker exec online-shopping-db psql -At -U project_depot -d project_depot -c 'SELECT count(*) FROM orders') orders"

      - name: Run restore atomicity suite (isolated postgres)
        run: bash scripts/test-restore-atomicity.sh

      - name: Run full restore proof (isolated postgres)
        run: bash scripts/restore-proof.sh

      - name: Run restore proof negative suite (isolated postgres)
        run: bash scripts/test-restore-proof-negative.sh
