name: HitPay sandbox UAT operation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controlled operation on the isolated sandbox backend
        required: true
        type: choice
        options:
          - status
          - create-checkout
          - refund-latest-captured
          - cancel-unpaid
  push:
    branches: [hitpay-sandbox-uat]
    paths:
      - deploy/hitpay-sandbox-uat-operation.txt

permissions:
  contents: read

concurrency:
  group: online-shopping-hitpay-sandbox-uat
  cancel-in-progress: false

env:
  VPS_HOST: 13.251.162.88
  VPS_USER: ubuntu
  VPS_HOST_KEY: "13.251.162.88 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxQLowecYMuChjSX+ePbEKdDq0m8NfT8kfKaSw0Z3sF"

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: hitpay-sandbox
    steps:
      - name: Configure pinned SSH
        shell: bash
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$LIGHTSAIL_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/lightsail-key"
          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lightsail-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/lightsail-known-hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/lightsail-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/lightsail-known-hosts" \
            | grep -Fq 'SHA256:EvysNdkRZEdS5wOyNFI+lZs2dH589gW9ycQGAiVImsE'

      - name: Run controlled sandbox operation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            OPERATION='${{ inputs.operation }}'
          else
            OPERATION=$(tr -d '[:space:]' < deploy/hitpay-sandbox-uat-operation.txt)
          fi
          case "$OPERATION" in
            status|create-checkout|refund-latest-captured|cancel-unpaid) ;;
            *) exit 2 ;;
          esac
          ssh -i "$RUNNER_TEMP/lightsail-key" -o BatchMode=yes -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/lightsail-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "sudo /opt/online-shopping-hitpay-sandbox/hitpay-sandbox-uat.sh '$OPERATION'"

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lightsail-key" "$RUNNER_TEMP/lightsail-known-hosts"
