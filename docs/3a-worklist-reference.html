<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Ekoway — 3a Worklist · locked visual reference (desktop 1440)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   3a WORKLIST — LOCKED VISUAL REFERENCE
   Extracted verbatim from Ekoway Directions.dc.html (option 3a).
   Desktop-only artifact. Do not restyle. Values here are authority.
   ============================================================ */
:root{
  /* colour */
  --canvas:#E8E4DC;      /* outside the page; not part of the design */
  --ground:#F5F2EC;      /* page ground */
  --surface:#FFFEFB;     /* header, cards, controls */
  --field:#FBF9F4;       /* search input well */
  --ink:#17191A;
  --ink-2:#4A4D47;
  --ink-3:#55584F;
  --ink-4:#6E6B63;
  --ink-5:#8A867D;       /* placeholder / meta */
  --line:#E4DFD5;        /* hairline on surface */
  --line-2:#DDD7CB;      /* hairline on ground */
  --line-3:#C9C2B4;      /* control border */
  --line-4:#D8D2C6;      /* input border */
  --line-5:#EFEBE3;      /* in-card divider */
  --green-deep:#14342A;  /* structural: band, buttons, marks */
  --green:#2A6A50;       /* category label, in-stock, WhatsApp */
  --green-on-dark:#8FB3A2;
  --orange:#D2542A;      /* RESERVED: low-stock state only */
  --grey-dot:#9A938A;    /* out of stock */
  --miss-bg:#F2EFE8;     /* image-unavailable panel */
  /* type */
  --display:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* metrics */
  --page:1440px;
  --gutter:36px;
  --header-h:66px;
  --nav-h:46px;
  --rail-w:296px;
  --shell-gap:32px;
  --grid-gap:20px;
  --card-img-h:176px;
}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0;background:var(--canvas);font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--ink)}
a{color:var(--green);text-decoration:none}
a:hover{color:var(--green-deep)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left}
:focus-visible{outline:2px solid var(--green-deep);outline-offset:2px}

.page{width:var(--page);min-height:1240px;margin:0 auto;position:relative;background:var(--ground);border:1px solid #D3CDC1}

/* ---------- 1. public header (66px) ---------- */
.hdr{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 var(--gutter)}
.logo{display:flex;align-items:center;gap:10px}
.logo__mark{width:14px;height:14px;background:var(--green-deep)}
.logo__word{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.logo__rule{width:1px;height:16px;background:var(--line)}
.logo__sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-5)}
.search{flex:1;display:flex;align-items:center;height:38px;border:1px solid var(--line-4);background:var(--field);max-width:520px}
.search__input{padding:0 12px;font-size:13.5px;color:var(--ink-5);flex:1;border:0;background:transparent;font-family:inherit;height:100%}
.search__input::placeholder{color:var(--ink-5)}
.search__btn{height:100%;display:flex;align-items:center;padding:0 16px;background:var(--green-deep);color:var(--ground);font-size:12.5px;font-weight:600;letter-spacing:.02em;cursor:pointer}
.utils{display:flex;align-items:center;gap:20px;margin-left:auto}
.lang{display:flex;align-items:center;gap:2px;border:1px solid var(--line);padding:2px}
.lang button{font-size:11.5px;padding:3px 8px;color:var(--ink-4);cursor:pointer}
.lang button[aria-current="true"]{font-weight:600;background:var(--green-deep);color:var(--ground)}
.lang button:last-child{font-size:12.5px}
.utils__account{font-size:13px;color:#3C3F3A}
.utils__cart{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);font-weight:500}
.utils__cart span{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--ground);padding:2px 6px}

/* ---------- 2. canonical department nav (46px) ---------- */
.deptnav{height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 var(--gutter)}
.deptnav__list{display:flex;align-items:stretch;gap:26px}
.deptnav__item{display:flex;align-items:center;font-size:13.5px;color:var(--ink-2);white-space:nowrap;flex:0 0 auto;cursor:pointer}
.deptnav__item[aria-current="true"]{font-weight:600;color:var(--ink);box-shadow:inset 0 -2px 0 var(--green-deep)}
.deptnav__wa{margin-left:auto;padding-left:24px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--green);font-weight:500;white-space:nowrap}
.deptnav__wa i{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* ---------- 3. JOB BAND (signature) ---------- */
.jobband{background:var(--green-deep);padding:16px var(--gutter);display:flex;align-items:center;gap:var(--shell-gap)}
.jobband__label{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--green-on-dark);width:78px;line-height:1.5}
.jobband__jobs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.job{cursor:pointer;white-space:nowrap;padding:8px 14px;font-size:13.5px;background:transparent;color:#CDDDD5;border:1px solid rgba(245,242,236,.28)}
.job[aria-pressed="true"]{font-weight:600;background:var(--ground);color:var(--green-deep);border-color:var(--ground)}
.jobband__out{text-align:right;border-left:1px solid rgba(245,242,236,.18);padding-left:28px}
.jobband__out dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--green-on-dark);margin-bottom:5px}
.jobband__out dd{margin:0;font-family:var(--display);font-size:16px;font-weight:600;color:var(--ground);letter-spacing:-.01em}

/* ---------- 4. main content shell ---------- */
.shell{display:flex;gap:var(--shell-gap);padding:26px var(--gutter) 0}

/* ---------- 5. job-context rail ---------- */
.rail{width:var(--rail-w);flex:0 0 var(--rail-w)}
.rail__title{font-family:var(--display);font-size:31px;font-weight:700;line-height:1.06;letter-spacing:-.028em;color:var(--ink);margin:0}
.rail__note{font-size:13.5px;line-height:1.55;color:var(--ink-3);margin-top:10px;text-wrap:pretty}
.rail__atmos{margin-top:18px;height:230px;background:repeating-linear-gradient(135deg,#E7E2D9 0 7px,#EFEBE3 7px 14px);border:1px solid var(--line-2);display:flex;align-items:flex-end;padding:14px}
.rail__atmos p{margin:0;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--ink-4);background:var(--ground);padding:6px 8px;border:1px solid var(--line-2)}
.rail__disclosure{font-size:11.5px;color:var(--ink-5);margin-top:8px;line-height:1.45}
.rail__depts{margin-top:24px;border-top:1px solid var(--line-2);padding-top:12px}
.rail__depts h3{margin:0 0 6px;font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.2em;color:var(--ink-5)}
.rail__dept{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.rail__dept b{font-size:13.5px;font-weight:400;color:var(--ink);white-space:nowrap}
.rail__dept i{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--ink-4)}

/* ---------- 6. catalogue toolbar ---------- */
.field{flex:1;min-width:0}
.toolbar{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.toolbar__count{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.toolbar__controls{margin-left:auto;display:flex;gap:10px}
.ctrl{display:flex;align-items:center;gap:8px;border:1px solid var(--line-3);background:var(--surface);padding:8px 13px;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.ctrl--filters{font-weight:500}
.ctrl__badge{font-family:var(--mono);font-size:10.5px;background:var(--green-deep);color:var(--ground);padding:1px 5px}
.ctrl__caret{font-size:9px;color:var(--ink-4)}

/* ---------- 7. product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap);padding:20px 0 40px}

/* ---------- 8. product card ---------- */
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.card__imgwrap{height:var(--card-img-h);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.card__img{width:100%;height:100%;object-fit:contain;object-position:center;background:var(--surface);padding:10px;display:block}
/* concept photo slot: stands in for a real <img>; NOT a product state */
.slot{height:100%;background:repeating-linear-gradient(135deg,#EDE9E1 0 7px,#F4F1EA 7px 14px);display:flex;align-items:center;justify-content:center}
.slot span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-5);background:var(--surface);padding:5px 9px;border:1px solid #E0DACE}
/* image unavailable */
.miss{height:100%;background:var(--miss-bg);background-image:repeating-linear-gradient(90deg,rgba(20,52,42,.05) 0 1px,transparent 1px 8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 18px;text-align:center}
.miss__mark{width:26px;height:26px;border:1px solid var(--green-deep);background:linear-gradient(135deg,transparent 49.5%,var(--green-deep) 49.5%,var(--green-deep) 50.5%,transparent 50.5%);opacity:.55}
.miss__dept{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--green-deep);margin-bottom:5px}
.miss__copy{font-size:11.5px;color:var(--ink-4);line-height:1.4}
.card__body{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1}
.card__dept{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--green);margin-bottom:7px}
.card__name{font-size:14.5px;font-weight:500;line-height:1.34;color:var(--ink);height:39px;overflow:hidden;text-wrap:pretty;margin:0}
.card__attr{font-family:var(--mono);font-size:11px;color:var(--ink-5);margin-top:7px}
.card__price{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-top:12px}
.card__stock{display:flex;align-items:center;gap:7px;margin-top:7px}
.card__stock i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.card__stock span{font-size:12px;color:var(--ink-2);white-space:nowrap}
.card__actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:13px;border-top:1px solid var(--line-5)}
.card__open{font-size:12.5px;font-weight:600;color:var(--green-deep);white-space:nowrap}
.card__cart{border:1px solid var(--ink);padding:7px 12px;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}

/* ---------- annotation only: not part of the design ---------- */
[data-annotation]{pointer-events:none}
.fold{position:absolute;left:0;right:0;top:900px;border-top:1px dashed rgba(23,25,26,.3)}
.fold span{position:absolute;left:0;top:-19px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;background:var(--ink);color:var(--ground);padding:3px 8px}
</style>
</head>
<body>
<div class="page">

  <header class="hdr">
    <div class="logo">
      <div class="logo__mark" aria-hidden="true"></div>
      <div class="logo__word">EKOWAY</div>
      <div class="logo__rule" aria-hidden="true"></div>
      <div class="logo__sub">HARDWARE</div>
    </div>
    <form class="search" role="search" onsubmit="return false">
      <input class="search__input" type="search" placeholder="Search products, sizes, brands…" aria-label="Search products">
      <button class="search__btn" type="submit">Search</button>
    </form>
    <div class="utils">
      <div class="lang" role="group" aria-label="Language">
        <button aria-current="true">EN</button>
        <button>BM</button>
        <button>中文</button>
      </div>
      <a class="utils__account" href="#">Account</a>
      <a class="utils__cart" href="#">Cart<span>2</span></a>
    </div>
  </header>

  <nav class="deptnav" aria-label="Departments">
    <div class="deptnav__list">
      <a class="deptnav__item" href="#" aria-current="true">All departments</a>
      <a class="deptnav__item" href="#">Building Materials</a>
      <a class="deptnav__item" href="#">Roofing &amp; Rain</a>
      <a class="deptnav__item" href="#">Plumbing &amp; Pumps</a>
      <a class="deptnav__item" href="#">Power Tools</a>
    </div>
    <a class="deptnav__wa" href="#"><i aria-hidden="true"></i>WhatsApp the store</a>
  </nav>

  <section class="jobband" aria-label="Working on">
    <div class="jobband__label">WORKING<br>ON</div>
    <div class="jobband__jobs" id="jobs"></div>
    <dl class="jobband__out">
      <dt>RESOLVES TO</dt>
      <dd id="resolves">&nbsp;</dd>
    </dl>
  </section>

  <div class="shell">
    <aside class="rail" aria-label="Job context">
      <h1 class="rail__title" id="railTitle">&nbsp;</h1>
      <p class="rail__note" id="railNote"></p>
      <div class="rail__atmos"><p>category atmosphere<br><span id="railAtmos"></span></p></div>
      <p class="rail__disclosure">Project inspiration — not exact product imagery.</p>
      <div class="rail__depts">
        <h3>DEPARTMENTS IN THIS JOB</h3>
        <div id="railDepts"></div>
      </div>
    </aside>

    <div class="field">
      <div class="toolbar">
        <div class="toolbar__count" id="resultCount"></div>
        <div class="toolbar__controls">
          <button class="ctrl ctrl--filters" aria-expanded="false">Filters<span class="ctrl__badge">3</span></button>
          <button class="ctrl">Sort: Relevance<span class="ctrl__caret" aria-hidden="true">▼</span></button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="fold" data-annotation="fold-1440x900"><span>1440 × 900 FOLD</span></div>
</div>

<script>
/* Concept data only. Production must read the live catalogue — see the handoff, section H. */
var STOCK_MODE = 'banded'; /* matches the selected screenshot. Alternative: 'banded-with-count' */

var PRODUCTS = [
  {id:'r1',name:'Heavy-Duty Galvanised Roofing Sheet 0.47mm × 3.0m, Anti-Rust Coated',category:'Roofing & Rain',price:89.9,stockQty:128,lowStock:false,imageUrl:'',attribute:'0.47mm gauge'},
  {id:'r2',name:'Aluminium Gutter Profile 4in × 3.0m',category:'Roofing & Rain',price:118,stockQty:62,lowStock:false,imageUrl:'photo',attribute:'3.0m length'},
  {id:'r3',name:'Roof & Gutter Sealant 300ml, Neutral Cure',category:'Roofing & Rain',price:24.9,stockQty:4,lowStock:true,imageUrl:'',attribute:'300ml'},
  {id:'r4',name:'Polycarbonate Awning Sheet 1.2m × 2.4m, UV-Stabilised',category:'Roofing & Rain',price:356,stockQty:18,lowStock:false,imageUrl:'',attribute:'UV-stabilised'},
  {id:'r5',name:'Roofing Screw with EPDM Washer 65mm, Box of 500',category:'Roofing & Rain',price:142,stockQty:37,lowStock:false,imageUrl:'',attribute:'Box of 500'},
  {id:'p1',name:'Inverter Pressure Pump 1.0HP with Automatic Controller',category:'Plumbing & Pumps',price:2798,stockQty:6,lowStock:false,imageUrl:'photo',attribute:'1.0HP'},
  {id:'p2',name:'PVC Pressure Elbow 90° 25mm',category:'Plumbing & Pumps',price:3.9,stockQty:1240,lowStock:false,imageUrl:'',attribute:'25mm'},
  {id:'p3',name:'Submersible Drainage Pump 0.5HP, Stainless Housing',category:'Plumbing & Pumps',price:689,stockQty:11,lowStock:false,imageUrl:'',attribute:'0.5HP'},
  {id:'p4',name:'Brass Ball Valve 25mm, Full Bore',category:'Plumbing & Pumps',price:32,stockQty:88,lowStock:false,imageUrl:'',attribute:'25mm'},
  {id:'t1',name:'1200W Angle Grinder 100mm with Anti-Vibration Handle',category:'Power Tools',price:299,stockQty:22,lowStock:false,imageUrl:'photo',attribute:'100mm disc'},
  {id:'t2',name:'Cordless Impact Driver 18V, Bare Tool',category:'Power Tools',price:458,stockQty:9,lowStock:false,imageUrl:'',attribute:'18V'},
  {id:'b1',name:'Ordinary Portland Cement 50kg',category:'Building Materials',price:21.5,stockQty:340,lowStock:false,imageUrl:'',attribute:'50kg'},
  {id:'b2',name:'Waterproofing Cement Slurry 20kg, Two-Component',category:'Building Materials',price:176,stockQty:0,lowStock:false,imageUrl:'',attribute:'20kg'}
];

/* Job lenses map to canonical department names only. Editorial copy — owner approval required. */
var JOBS = [
  {id:'rain',name:'Rain & Roofline',atmos:'roofline in heavy rain',note:'Everything the monsoon touches — sheets, gutters, sealants, and the pumps that move water away from the house.',departments:['Roofing & Rain','Plumbing & Pumps','Building Materials','Power Tools']},
  {id:'water',name:'Water Supply',atmos:'pump room and pressure tank',note:'Pressure, storage, and the fittings that hold it together in constant heat.',departments:['Plumbing & Pumps']},
  {id:'wet',name:'Wet Works',atmos:'bathroom under waterproofing',note:'Bathrooms, kitchens, and slabs — waterproofing first, finishes second.',departments:['Building Materials','Plumbing & Pumps']},
  {id:'cut',name:'Cutting & Fixing',atmos:'cutting sheet on site',note:'Sizing sheet, drilling masonry, and fastening it so humidity never loosens it.',departments:['Power Tools','Roofing & Rain']}
];

function formatPrice(v){return 'RM ' + Number(v).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function stockOf(p){
  if(p.stockQty === 0) return {text:'Out of stock',color:'var(--grey-dot)'};
  if(p.lowStock) return {text:'Low stock — ' + p.stockQty + ' left',color:'var(--orange)'};
  return {text: STOCK_MODE === 'banded-with-count' ? 'In stock — ' + p.stockQty + ' available' : 'In stock', color:'var(--green)'};
}

/* Missing images are interleaved with photographed products, never batched. */
function orderFor(job){
  var inJob = PRODUCTS.filter(function(p){return job.departments.indexOf(p.category) > -1;});
  var withPhoto = inJob.filter(function(p){return p.imageUrl;});
  var without = inJob.filter(function(p){return !p.imageUrl;});
  var out = [];
  while(without.length || withPhoto.length){
    if(without.length) out.push(without.shift());
    if(without.length) out.push(without.shift());
    if(withPhoto.length) out.push(withPhoto.shift());
  }
  return out;
}

function imageBlock(p){
  if(p.imageUrl){
    /* Production: a real <img src> with the same reserved frame. Runtime failure -> .miss */
    return '<div class="slot" data-annotation="photo-slot"><span>PRODUCT PHOTO</span></div>';
  }
  return '<div class="miss"><div class="miss__mark" aria-hidden="true"></div><div>' +
    '<div class="miss__dept">' + esc(p.category.toUpperCase()) + '</div>' +
    '<div class="miss__copy">Product image is not available yet.</div></div></div>';
}

function cardHTML(p){
  var s = stockOf(p);
  return '<article class="card">' +
    '<a class="card__imgwrap" href="#product-' + p.id + '" aria-label="' + esc(p.name) + '">' + imageBlock(p) + '</a>' +
    '<div class="card__body">' +
      '<div class="card__dept">' + esc(p.category.toUpperCase()) + '</div>' +
      '<h2 class="card__name"><a href="#product-' + p.id + '" style="color:inherit">' + esc(p.name) + '</a></h2>' +
      (p.attribute ? '<div class="card__attr">' + esc(p.attribute) + '</div>' : '') +
      '<div class="card__price">' + formatPrice(p.price) + '</div>' +
      '<div class="card__stock"><i style="background:' + s.color + '" aria-hidden="true"></i><span>' + esc(s.text) + '</span></div>' +
      '<div class="card__actions">' +
        '<a class="card__open" href="#product-' + p.id + '">View product →</a>' +
        '<button class="card__cart" type="button">Add to Cart</button>' +
      '</div>' +
    '</div></article>';
}

var activeJobId = 'rain';

function render(){
  var job = JOBS.filter(function(j){return j.id === activeJobId;})[0];
  var items = orderFor(job);
  var counts = {};
  PRODUCTS.forEach(function(p){counts[p.category] = (counts[p.category] || 0) + 1;});
  var deptsInJob = job.departments.filter(function(d){return counts[d];});

  document.getElementById('jobs').innerHTML = JOBS.map(function(j){
    return '<button class="job" type="button" aria-pressed="' + (j.id === activeJobId) + '" data-job="' + j.id + '">' + esc(j.name) + '</button>';
  }).join('');
  document.getElementById('resolves').textContent = deptsInJob.length + ' departments · ' + items.length + ' products';
  document.getElementById('railTitle').textContent = job.name;
  document.getElementById('railNote').textContent = job.note;
  document.getElementById('railAtmos').textContent = job.atmos;
  document.getElementById('railDepts').innerHTML = deptsInJob.map(function(d){
    return '<div class="rail__dept"><b>' + esc(d) + '</b><i>' + counts[d] + '</i></div>';
  }).join('');
  document.getElementById('resultCount').textContent = items.length + ' products · ' + job.name;
  document.getElementById('grid').innerHTML = items.map(cardHTML).join('');

  Array.prototype.forEach.call(document.querySelectorAll('.job'), function(b){
    b.addEventListener('click', function(){ activeJobId = b.getAttribute('data-job'); render(); });
  });
}
render();
</script>
</body>
</html>
