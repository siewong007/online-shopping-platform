# STAGING stack for staging.ekowayhardware.com on the same AIC VPS as prod.
# Isolated Compose project — own DB/secrets/ports. Never touches /opt/online-shopping.
#
# The host-level Caddy process owns ports 80/443. Every port here is bound to
# loopback, so only Caddy (or an administrator on the VPS) can reach it. This
# stack uses :4000 and :8082 with online-shopping-specific names. Its
# PostgreSQL port is not published at all; maintenance uses
# `docker exec online-shopping-db`.
#
# The box has ~2GB RAM shared across four Compose projects, so every
# service below sets a hard mem_limit: it protects payroll and saliminn from
# this stack rather than letting the kernel OOM-killer pick an arbitrary
# victim if this app misbehaves.
#
# deploy.sh supplies IMAGE_TAG, POSTGRES_PASSWORD, and ADMIN_SEED_PASSWORD. Images are loaded
# directly from a release bundle; no registry or additional AWS service is
# involved.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:19beta1
    container_name: online-shopping-staging-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=24MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_parallel_workers=1
    environment:
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: online_shopping
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_admin -d online_shopping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 32mb
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - database

  backend:
    image: "online-shopping-backend:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: online-shopping-staging-backend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4002:4000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "4000"
      APP_ENV: "production"
      DATABASE_URL: "postgres://shop_admin:${POSTGRES_PASSWORD}@postgres:5432/online_shopping"
      ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD is required}"
      FRONTEND_ORIGIN: "https://staging.ekowayhardware.com"
      # HitPay production capability is intentionally disabled until PAYMENT_PRIMARY_PROVIDER
      # is explicitly set to hitpay and a separate production credential pair is added to the
      # root-owned secrets.env file. Blank values preserve the current provider behavior.
      PAYMENT_PRIMARY_PROVIDER: "${PAYMENT_PRIMARY_PROVIDER:-}"
      HITPAY_MODE: "${HITPAY_MODE:-sandbox}"
      HITPAY_PRODUCTION_API_KEY: "${HITPAY_PRODUCTION_API_KEY:-}"
      HITPAY_PRODUCTION_WEBHOOK_SALT: "${HITPAY_PRODUCTION_WEBHOOK_SALT:-}"
      HITPAY_PRODUCTION_API_URL: "https://api.hit-pay.com"
      HITPAY_REDIRECT_URL: "https://staging.ekowayhardware.com/shop?payment_return=hitpay"
      # Optional operator capabilities are forwarded from the environment/secrets.env when set.
      # Blank values preserve the current disabled behavior (email off, MFA key absent, payments
      # in their default activation mode). TRUST_PROXY and RATE_LIMIT_PER_MINUTE fall back to the
      # same defaults the backend applies when unset (true / 120).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:-}"
      PAYMENT_ACTIVATION_MODE: "${PAYMENT_ACTIVATION_MODE:-}"
      # Cloudflare Turnstile secret from secrets.env; blank keeps the bot gate fail-open.
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      RUST_LOG: warn
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 96m
    cpus: 0.35
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - app
      - database

  frontend:
    image: "online-shopping-frontend:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: online-shopping-staging-frontend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - app

volumes:
  postgres_data:
    driver: local

networks:
  app:
    driver: bridge
  database:
    # Only the backend is dual-homed. PostgreSQL has no Internet-facing Docker
    # network and no published host port.
    internal: true
